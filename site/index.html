<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Repository-backed flashcards with local study progress">
    <title>Jeremy IT's Lab CCNA Flashcards</title>
    <script src="theme.js?v=2"></script>
    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>
    <header><a class="brand" href="./"><span class="logo">r.</span> recall</a><span>● Progress stays in this browser</span></header>
    <main>
        <section id="dashboard">
	    <h1> 
		<a href="https://www.youtube.com/playlist?list=PLxbwE86jKRgMpuZuLBivzlM8s2Dk5lXBQ">CCNA Playlist</a>
	    </h1>
            <div class="stats">
                <div><b id="due">0</b>ready to review</div>
                <div><b id="learning">0</b>learning</div>
                <div><b id="new">0</b>not started</div>
                <div><b id="today">0</b>studied today</div>
            </div>
            <div class="section-title">
                <h2>Your library <small id="deck-count"></small></h2><input id="search" type="search" placeholder="Find a deck…" aria-label="Find a deck"></div>
            <div id="decks" class="decks"></div>
            <p id="message" role="status"></p>
            <footer>Built for steady progress. Decks are curated in the repository.<br><button id="export" class="text-button">Back up progress ↓</button><span id="storage-status" role="status"></span></footer>
        </section>
        <section id="study" hidden>
            <div class="study-top"><button id="exit" class="text-button">← Your library</button><span id="session-count"></span></div>
            <div id="study-deck" class="eyebrow"></div>
            <h1 id="study-title">Time to remember.</h1>
            <div class="card-shell"><span id="card-label" class="eyebrow">QUESTION</span><iframe id="card" title="Flashcard" sandbox="" referrerpolicy="no-referrer"></iframe></div>
            <div id="reveal-wrap"><button id="reveal" class="primary">Show answer <kbd>Space</kbd></button>
                <p class="hint">Take a moment. Try to recall it first.</p>
            </div>
            <div id="ratings" hidden>
                <p class="hint">How well did you remember?</p>
                <div class="ratings"><button data-rating="again"><b>Again</b><small>1 minute · 1</small></button><button data-rating="hard"><b>Hard</b><small>6 minutes · 2</small></button><button data-rating="good"><b>Good</b><small id="good-interval"></small></button><button data-rating="easy"><b>Easy</b><small id="easy-interval"></small></button></div>
            </div>
        </section>
    </main>
    <script type="module" src="app.js?v=2"></script>
</body>

</html>
